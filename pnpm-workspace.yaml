shellEmulator: true
trustPolicy: no-downgrade
packages:
  - playground
  - docs
  - packages/*
  - examples/*

catalogs:
  cli:
    '@antfu/eslint-config': ^9.3.0
    '@antfu/ni': ^30.5.0
    bumpp: ^12.2.1
    esbuild: ^0.28.2
    eslint: ^10.9.0
    lint-staged: ^17.3.0
    simple-git-hooks: ^2.13.1
    tsx: ^4.23.12
    typescript: ^6.0.3
    unbuild: ^3.6.1
    vite: ^8.2.2
  frontend:
    nanoevents: ^10.0.0
  inlined:
    '@antfu/utils': ^9.3.0
  playground:
    '@vitejs/plugin-vue': ^6.0.8
    '@vueuse/core': ^14.4.0
    unocss: ^66.8.1
    vue: ^3.5.41
    vue-tsc: ^3.3.11
  testing:
    vitest: ^4.1.11
    vitest-package-exports: ^1.2.0
    yaml: ^2.9.0
  types:
    '@types/node': ^26.2.0
  utils:
    tinyexec: ^1.3.0
update:
  ignoreDeps:
    - typescript@7
allowBuilds:
  esbuild: true
  simple-git-hooks: true
